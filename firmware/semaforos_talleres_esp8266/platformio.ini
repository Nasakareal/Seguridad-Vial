[platformio]
default_envs = master

[env]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
lib_deps = bblanchon/ArduinoJson@^7.0.0
build_flags = -Wall -Wextra

[env:master]
build_flags = ${env.build_flags} -DCONTROLLER_ROLE_MASTER=1

[env:follower]
build_flags = ${env.build_flags} -DCONTROLLER_ROLE_MASTER=0
